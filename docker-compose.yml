# devsecshop/docker-compose.yml
# Lance DevSecShop en local pour le lab.
#   docker compose up --build
# L'appli écoute sur http://localhost:3000

services:
  app:
    build: .
    container_name: devsecshop
    ports:
      # Mode CTF : exposé sur 0.0.0.0 (toutes les interfaces) pour un accès depuis
      # d'autres machines. À réserver à un réseau de salle isolé / de confiance.
      - "0.0.0.0:3000:3000"
    environment:
      - PORT=3000
      # Les secrets sont volontairement laissés en valeurs faibles / par défaut.
      - JWT_SECRET=devsecshop-super-secret-2023
      - DB_FILE=/tmp/devsecshop.db
    # Un conteneur cible interne pour les TP SSRF (sert de "service interne"
    # que l'étudiant ne devrait pas pouvoir atteindre depuis l'appli).
    depends_on:
      - internal

  # Faux service interne (métadonnées / admin) : cible de la SSRF (TP4).
  internal:
    image: hashicorp/http-echo
    container_name: internal-metadata
    command: ["-text=SECRET-INTERNAL-TOKEN=aws-fake-metadata-9f3b2c"]
    expose:
      - "5678"   # accessible seulement depuis le réseau docker, pas publié
