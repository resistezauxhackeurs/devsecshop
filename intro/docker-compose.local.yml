# app_intro-compromission/docker-compose.local.yml
# LAB VOLONTAIREMENT VULNÉRABLE - local uniquement, jamais exposé sur internet.
# Mode CTF : exposé sur 0.0.0.0 (toutes interfaces). Réseau de salle isolé uniquement.
services:
  cible:
    build: ./cible
    container_name: intro-compromission
    ports:
      - "0.0.0.0:8080:80"
    networks: [lab]

networks:
  lab:
    driver: bridge
