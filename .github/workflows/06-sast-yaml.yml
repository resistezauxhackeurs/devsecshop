# devsecshop/.github/workflows/06-sast-yaml.yml
# TP6 — SAST + SCA ciblés sur la désérialisation YAML.
name: Security - YAML
on: [push, pull_request]
jobs:
  semgrep-yaml:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --error --config ./semgrep-rules/yaml-load.yml
  sca-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: js-yaml doit etre >= 4
        run: node -e "const v=require('js-yaml/package.json').version; if(+v.split('.')[0]<4){console.error('js-yaml trop ancien:',v);process.exit(1)} console.log('js-yaml',v,'OK')"
