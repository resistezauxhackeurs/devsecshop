# devsecshop/.github/workflows/02-secrets.yml
# TP2 — Détection de secrets dans le code et l'historique git.
# Fait ÉCHOUER le build si un secret est trouvé.
name: Security - Secrets
on:
  workflow_dispatch:   # execution MANUELLE seulement (cours en local ; CI de reference)
jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : on scanne aussi les commits passés
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
