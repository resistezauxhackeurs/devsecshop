# devsecshop/.github/workflows/08-container.yml
# TP8 (bonus) — Sécurité du conteneur : lint Dockerfile + scan de vulnérabilités d'image.
name: Security - Container
on: [push, pull_request]
jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  trivy:
    name: Trivy (image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devsecshop:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: devsecshop:ci
          severity: HIGH,CRITICAL
          # Informatif (exit-code 0) : les CVE HIGH/CRITICAL viennent surtout de
          # l'image de base (node:20) et evoluent en amont -> on les AFFICHE sans
          # bloquer en permanence. Pour en faire une gate, repasser exit-code a '1'
          # et durcir l'image (node:20-slim, mises a jour).
          exit-code: '0'
          ignore-unfixed: true
