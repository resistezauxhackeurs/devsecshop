# .github/workflows/dast.yml
# DAST - scan dynamique (OWASP ZAP baseline) de l'app en marche, authentifie admin.
# Complement "self-test" : equivalent CI de scripts/scan.sh. Ne casse pas le build
# (le rapport est publie en artefact). Le durcissement de la pipeline (gate, etc.)
# reste l'objet des TP ; ce job montre le DAST automatise.
name: DAST (ZAP baseline)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  zap:
    name: ZAP baseline (authentifie)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Demarrer l'app
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ >/dev/null 2>&1 && break || sleep 2; done

      - name: Session admin
        id: auth
        run: |
          JWT=$(curl -fsS -o /dev/null -c - \
            --data-urlencode 'username=admin' --data-urlencode 'password=S3cur3P@ss' \
            http://localhost:3000/login | awk '$6=="session"{print $7}' | tail -1)
          echo "cookie=session=$JWT" >> "$GITHUB_OUTPUT"

      - name: ZAP baseline
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://host.docker.internal:3000 -r zap.html -I \
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=${{ steps.auth.outputs.cookie }}" \
            || true

      - name: Publier le rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/zap.html
          if-no-files-found: warn
