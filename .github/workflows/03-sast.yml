# devsecshop/.github/workflows/03-sast.yml
# TP3 — Analyse statique (SAST) avec Semgrep. Échoue si une règle trouve une faille.
name: Security - SAST
on:
  push:
  pull_request:
jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (règles maison + registre)
        run: semgrep scan --error --sarif --output semgrep.sarif
             --config ./semgrep-rules --config "p/javascript"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
